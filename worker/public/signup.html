<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your account – LobbyApp</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">L</span>LobbyApp</a>
      <nav class="nav"><a href="/signin">Sign in</a></nav>
    </div>
  </header>

  <main class="auth">
    <div class="wrap narrow">
      <h1>Create your account</h1>
      <p class="muted">LobbyApp is currently in beta.</p>
      <form id="signup" class="card" novalidate>
        <div class="notice"></div>
        <div class="field">
          <label for="businessName">Business name</label>
          <input id="businessName" name="businessName" type="text" autocomplete="organization" required maxlength="100">
          <div class="hint">Shown at the top of your dashboard. You can change it later.</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
          <div class="hint">At least 10 characters.</div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-block" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:16px">Already have an account? <a href="/signin">Sign in</a></p>
    </div>
  </main>

  <script src="/assets/site.js"></script>
  <script>
    Lobby.bindForm(document.getElementById('signup'), 'POST', '/api/signup', function () {
      window.location.href = '/dashboard';
    }, function (body) {
      if (body.password !== body.confirm) return 'The passwords don’t match.';
      delete body.confirm;
    });
  </script>
</body>
</html>
