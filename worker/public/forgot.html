<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password – LobbyApp</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">L</span>LobbyApp</a>
      <nav class="nav"><a href="/signin">Sign in</a></nav>
    </div>
  </header>

  <main class="auth">
    <div class="wrap narrow">
      <h1>Reset your password</h1>
      <p class="muted">Enter your account email and we'll send you a link to choose a new password.</p>
      <form id="forgot" class="card" novalidate>
        <div class="notice"></div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-block" type="submit">Send reset link</button>
      </form>
      <p class="muted" style="margin-top:16px">Didn't get it? Check your spam folder, or <a href="/contact">contact us</a>.</p>
    </div>
  </main>

  <script src="/assets/site.js"></script>
  <script>
    Lobby.bindForm(document.getElementById('forgot'), 'POST', '/api/forgot', function (data, form) {
      Lobby.showNotice(form.querySelector('.notice'),
        'If that email has an account, a reset link is on its way. It works for 60 minutes.', 'ok');
      form.reset();
    });
  </script>
</body>
</html>
