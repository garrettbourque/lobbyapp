<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us – LobbyApp</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/"><span class="logo-mark">L</span>LobbyApp</a>
      <nav class="nav" data-auth-nav>
        <a href="/signin" data-signed-out>Sign in</a>
        <a class="btn" href="/signup" data-signed-out>Get started</a>
        <a class="btn" href="/dashboard" data-signed-in hidden>Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="auth">
    <div class="wrap narrow">
      <h1>Contact us</h1>
      <p class="muted">Questions, problems with your kiosk, or ideas? Send us a message and we'll reply by email.</p>
      <form id="contact" class="card" novalidate>
        <div class="notice"></div>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="100">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="5000"></textarea>
          <div class="hint">Please don't include client names or health information.</div>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="btn btn-block" type="submit">Send message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span data-year></span> LobbyApp</span>
      <span><a href="/">Home</a></span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      Lobby.bindForm(document.getElementById('contact'), 'POST', '/api/contact', function (data, form) {
        form.reset();
        Lobby.showNotice(form.querySelector('.notice'), 'Thanks! Your message was sent. We’ll reply by email.', 'ok');
      });
    });
  </script>
</body>
</html>
