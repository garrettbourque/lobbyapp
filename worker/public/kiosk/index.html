<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Welcome</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/kiosk/styles.css">
</head>
<body>
  <div id="app">
    <!-- Filled in by app.js from the kiosk's screens. -->
    <section id="screen" class="screen active">
      <h1 id="message" class="question"></h1>
      <p id="phone" class="phone-wrap" hidden>Phone: <a id="phone-link" href="#" class="phone-link"></a></p>
      <div id="buttons" class="buttons"></div>
      <p id="countdown" class="countdown" aria-live="polite"></p>
    </section>
  </div>

  <script src="/kiosk/config.js"></script>
  <script src="/kiosk/app.js"></script>
</body>
</html>
